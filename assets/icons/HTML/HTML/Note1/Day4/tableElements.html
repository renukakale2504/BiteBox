<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Demo</title>
</head>
<body>
    <center>
        <h2> Employee Details</h2>
        <table border="4" cellspacing="5" cellpadding="5" bgcolor="Yellow">
            <tr align="center" bgcolor="blue">
                <!--<tr> used for table row-->
                <!--<th> is used for table header, these are column heading-->
                <!--<td> is used for regular data cell, for storing data-->
                <th>Sr.No </th> 
                <th>Name</th>
                <th>Email</th>
                <th>Photos</th>
            </tr>

            <tr align="center" bgcolor="Yellow">
            <td>1</td>
            <td>Renuka</td>
            <td>r@gmail.com</td>
            <td><img src="" alt="renuka"/></td>
            </tr>

            <tr align="center" bgcolor="grey">
            <td>2</td>
            <td>Rahul</td>
            <td>rahul@gmail.com</td>
            <td><img src="" alt="rahul"/></td>
            </tr>

            <tr align="center" bgcolor="pink">
            <td>3</td>
            <td>Reva</td>
            <td>reva@gmail.com</td>
            <td><img src="" alt="reva"/></td>
            </tr>
        </table>
    </center>
</body>
</html>
