<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEXT FORMATING ELEMENTS </title>
</head>
<body>
    <!--Text formating elements are inline elements -->
    <i>Italic</i>
    <em>Emphasis tag</em>
    <h1>Welcome <i>Ganesha</i></h1>
    <b>Welcome bold</b>
    <strong>Welcome strong</strong>
    <br>
    <u>Welcome Underline</u>
    <ins>Welcome ins</ins>
    <br/>
    <del>Delete Text</del>
    <br/>
    <!--Line on Text-->
    <strike>Strike is depricated</strike>
    <br/>
    <small>Small Text</small>
    <br/>
    <big>Big Text</big>
    <br/>
    <p>Today's Date : 17<sup>th</sup>sept 2026</p>
    <br/>
    <p>Water Formula : H<sub>2</sub>O</p>

    <!--Special Character-->
    <h1>&lsaquo; html &rsaquo;</h1>
    <h1>&lt; html &gt;</h1>
    <h1>&reg; Register</h1>
    <h1>&#65; &copy;</h1>
    
     
</body>
</html>
