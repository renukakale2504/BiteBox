<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form method="get" action="formDemo.html" target="_blank">
    <fieldset>                           <!--group form element--> 
        <legend>Register Here</legend>   <!--title of the group-->     
        <label>Enter your full name :</label>  <!--label is used to define a text label for a form input element.-->
        <input type="text" required placeholder="Firstname Middlename Lastname">
        <br><br>

        <label>Enter Email : </label>
        <input type="email" required placeholder="Enter email">
        <br><br>
        
        <label>Enter Password :</label>
        <input type="password" required placeholder="Enter password">
        <br><br>

        <label>Confirm Password</label>
        <input type="password" required placeholder="Enter Password">
        <br><br>

        <label>Enter Mobile No. :</label>
        <input type="number" required placeholder="number">
        <br><br>

        <label>Enter Address :</label>
        <textarea row="5"></textarea>
        <br><br>

        <label>Select Gender :</label>
        <input type="radio">              <!--A radio button is a UI control that lets a user select exactly one option from a group.-->
        <label>Male</label>
        <input type="radio">
        <label>Female</label>
        <br><br>

        <label>Select Language :</label>

        <input type="checkbox">           <!--A checkbox is a small box you click to select or deselect an option-->
        <label>Marathi</label>

        <input type="checkbox">
        <label>Hindi</label>

        <input type="checkbox">
        <label>English</label>
        <br><br>

        <label>Select Course :</label>
        <select>
            <option>Select</option>
            <option>JFSD</option>
            <option>PFSD</option>
        </select>
        <br><br>

        <label>Select Date of Birth :</label>
        <input type="date">
        <br><br>

        <label>Upload your Resume :</label>
        <input type="file">
        <br><br>

        
        <input type="submit" value="submit">
        <input type="button" value="Cancel">
        <input type="reset" value="Reset">
        
    </fieldset>
    </form>
</body>
</html>
