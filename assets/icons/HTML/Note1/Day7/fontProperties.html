<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Property</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
    <!--Firstly i have to use an API, API to be called in head section with the help of link class and ideas written I have to apply that -->

    <style>
        .h1{
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        .para{
            font-size: 50px;  /*font unit=> px,rem,em,%,vh,vw, 
            /px = fixed size , rem = based on root font size
            1rem = 16px
            2rem = 32px
            1.5rem = 24px
            0.5rem = 8px ,  root font size is the base size from which rem values are calculated.
            %=a portion/percentage of a related size
            -width: 100% → full available width
            width: 50% → half the available width
            width: 25% → one-quarter of the available width
            vh → viewport height
            vw → viewport width
            vh means Viewport Height.
            1vh = 1% of the browser window's height.
            */
            
            font-weight:bold; /*font-weight is a CSS property that controls how thick or bold text appears*/
            font-style: italic;
            font-optical-sizing: auto;
            font-display: block;
        }

        .parisienne-regular {
        font-family: "Parisienne", cursive;
        font-weight: 400;
        font-style: normal;
    }


    </style>
</head>
<body>
    <h1 class="h1">This is heading</h1>
    <p class="para">This is para-1</p>
    <h2 class="parisienne-regular">This custom font</h2>
</body>
</html>
