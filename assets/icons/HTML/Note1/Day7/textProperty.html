<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Property</title>
    <style>
        .text1{
            text-align: center;
            text-transform: capitalize;
            text-decoration: underline;
            letter-spacing: 3px;
            word-spacing: 5px;
            line-height: 2px;
            text-shadow: 30px 10px 20px pink;
        }
        .text2{
            text-indent: 50px;
        }
    </style>
</head>
<body>
    <h1 class="text1">CSS Text Property</h1>

    <p>This para with text align</p> 
        <!--text-align → aligns text
        align-items → aligns items inside a container, 
        Align = position or arrange something properly.-->

    <p class="text2">this para with text indent</p> 
        <!-- Indent = add space at the beginning-->

    <p>Wrap text aaa bbb ccc</p>

    <pre style="white-space: nowrap;">xxxx          yyyy                zzzz</pre> 
        <!--pre is an element selector that selects all <pre> HTML elements.-->
        <!--style in HTML is used to change the appearance of an element
         Whitespace = blank space used to separate or position content
          Wrap = text moves to the next line.
          No wrap = text stays on the same line.-->

    <div style="direction:rtl;">
            <!--direction controls the direction in which text is displayed.
            ltr → Left → Right , rtl → Right → Left-->
        <a href="#">Home</a>
        <a href="#">About</a>
    </div>
</body>
</html>
