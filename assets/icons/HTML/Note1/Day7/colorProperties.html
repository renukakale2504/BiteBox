<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Property</title>

    <style>
        h1 {
            color: palevioletred;
        }
        
        p {
            color: rgb(159, 87, 82);
            /*rgba is also a color combination*/
        }

        h2{
            color: #03fc6b; /*hexcolor*/
        }
    </style>
</head>
<body>
    <h1>Color Property</h1>
    <p>Welcome</p>
    <h2>Hello Course</h2>
</body>
</html>
